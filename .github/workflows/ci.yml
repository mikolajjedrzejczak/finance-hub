name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run Unit Tests
        run: npm run test

      - name: Build nextjs app
        run: npm run build
        env:
          DATABASE_URL: 'postgresql://mock:mock@localhost:5432/mockdb'
          NEXTAUTH_SECRET: 'mock_secret_for_ci_build_test_12345'
          NEXTAUTH_URL: 'http://localhost:3000'

      - name: Prepare Deployment Package
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir deploy-package
          cp -r .next/standalone/* deploy-package/
          mkdir -p deploy-package/.next
          cp -r .next/static deploy-package/.next/static
          cp -r public deploy-package/public 2>/dev/null || true
          cp -r prisma deploy-package/prisma 2>/dev/null || true
          cd deploy-package
          zip -r ../release.zip .
          cd ..

      - name: Login to Azure
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-finance-hub-tx6ls2'
          package: 'release.zip'
